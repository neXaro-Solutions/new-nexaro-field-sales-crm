name: complete-crm-loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Integrate secure CRM scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="app.js?v=370"></script>'
          if marker not in s:
              raise SystemExit('app.js script marker not found')
          scripts = ('<script src="nexaro-config.js"></script>'
                     '<script src="supabase-auth.js"></script>'
                     '<script src="crm-bootstrap.js"></script>'
                     '<script src="crm-auth-ui.js"></script>'
                     '<script src="supabase-lead-sync.js"></script>')
          if 'nexaro-config.js' not in s:
              s = s.replace(marker, scripts + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: load secure CRM auth and QR lead sync'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/complete-crm-loader.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove one-time integration workflow'
          git push
