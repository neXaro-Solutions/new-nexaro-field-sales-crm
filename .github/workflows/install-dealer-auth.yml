name: Wire dealer auth
on:
  workflow_dispatch:

jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add dealer auth script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="dealer-auth.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('index.html has no </body> marker')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'neXaro Solutions'
          git config user.email 'kontakt@nexaro-solutions.de'
          git add index.html
          git diff --cached --quiet || git commit -m 'Integrate secure dealer login'
          git push
