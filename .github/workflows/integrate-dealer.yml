name: Integrate dealer extension
on:
  push:
    branches: [sumup-tarifvergleich-v2]
    paths: [dealer.js]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate extension
        run: |
          set -e
          grep -q "neXaro Händlerverwaltung" app.js && exit 0
          printf '\n' >> app.js
          cat dealer.js >> app.js
          rm dealer.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js dealer.js
          git commit -m 'Integrate dealer management extension' || exit 0
          git push
