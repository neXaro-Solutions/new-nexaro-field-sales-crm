name: Fix VAPE CSV import
on:
  push:
    branches:
      - sumup-tarifvergleich-v2
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix UTF-8 BOM and CSV EK import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="const head=rows.shift().map(x=>String(x||'').trim().replace(/^=\"(.*)\"$/,'$1').toLowerCase());"
          new="const head=rows.shift().map(x=>String(x||'').trim().replace(/^\\uFEFF/,'').replace(/^=\"(.*)\"$/,'$1').toLowerCase());"
          if old not in s:
              raise SystemExit('CSV header pattern not found')
          s=s.replace(old,new,1)
          s=s.replace('toast(\"Kein VK verfügbar – L3-Zuordnung prüfen\")','toast(\"Kein VK verfügbar – CSV-Artikel prüfen\")',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix VAPE CSV BOM import for EK prices"
          git push
