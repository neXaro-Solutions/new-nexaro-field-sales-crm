name: Wire QR lead sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add CRM sync loader
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'supabase-lead-sync.js' index.html; then
            python3 - <<'PY'
from pathlib import Path
p=Path('index.html')
s=p.read_text(encoding='utf-8')
needle='<script src="area-fix.js?v=2"></script>'
insert=needle+'<script src="supabase-lead-sync.js?v=1"></script>'
if needle not in s:
    raise SystemExit('Expected script anchor not found in index.html')
p.write_text(s.replace(needle, insert, 1), encoding='utf-8')
PY
            git config user.name 'neXaro Solutions Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add index.html
            git commit -m 'Wire Supabase QR lead sync into CRM' || exit 0
            git push
          else
            echo 'QR lead sync already wired.'
          fi
